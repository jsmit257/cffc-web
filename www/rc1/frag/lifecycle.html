<div class="table lifecycle" x-fetch="lifecycles" x-target=">.rows.ndx" breadcrumb="lifecycle">
  <div class="rows ndx">
    <div class="row hover x-template">
      <div class="static mtime" name="mtime" x-formatter="long-date"></div>
      <div class="mdash">&mdash;</div>
      <div class="static location" name="location"></div>
      <div class="static status">&nbsp;</div>
      <div class="static tombstones">
        <!-- put interesting attributes here -->
        <div class="sunset">&nbsp;</div>
      </div>
    </div>
  </div>

  <div class="singleton lifecycle" ts-edit="lifecycles">
    <label class="field hover">
      <div class="label">Location</div>
      <input class="location" name="location" tabindex="0">
    </label>

    <label class="field hover no-add">
      <div class="label">Yield (g)</div>
      <input class="yield" name="yield" type="number" min="0" step="0.01" value="0.00" tabindex="0">
      <div class="dry-weight" x-formatter="fixed">dry weight</div>
    </label>

    <label class="field hover no-add">
      <div class="label">Count</div>
      <input class="count" name="count" type="number" min="0" step="0.01" value="0.00" tabindex="0">
      <div class="per-kilo" x-formatter="fixed">per kilo</div>
    </label>

    <label class="field hover no-add">
      <div class="label">Gross (g)</div>
      <input class="gross" name="gross" type="number" min="0" step="0.01" value="0.00" tabindex="0">
    </label>

    <label class="field hover">
      <div class="label">Strain</div>
      <select class="strains" name="strain" x-fetch="strains" render="strain" tabindex="0"></select>
    </label>

    <label class="field hover">
      <div class="label">Strain Cost</div>
      <input class="strain_cost" name="strain_cost" type="number" min="0" step="0.01" value="0.00" tabindex="0">
    </label>

    <label class="field hover">
      <div class="label">Grain</div>
      <select class="grain substrate" name="grain_substrate" x-fetch-multi="substrates" render="substrate"
        tabindex="0"></select>
    </label>

    <label class="field hover">
      <div class="label">Grain Cost</div>
      <input class="grain_cost" name="grain_cost" type="number" min="0" step="0.01" value="0.00" tabindex="0">
    </label>

    <label class="field hover">
      <div class="label">Bulk</div>
      <select class="bulk substrate" name="bulk_substrate" x-fetch-multi="substrates" render="substrate"
        tabindex="0"></select>
    </label>

    <label class="field hover">
      <div class="label">Bulk Cost</div>
      <input class="bulk_cost" name="bulk_cost" type="number" min="0" step="0.01" value="0.00" tabindex="0">
    </label>

    <div class="field hover mtime">
      <div class="label">Modified</div>
      <div class="mtime short-date" name="mtime" x-formatter="short-date"></div>
    </div>

    <div class="field hover ctime">
      <div class="label">Created</div>
      <div class="ctime short-date" name="ctime" x-formatter="short-date"></div>
    </div>
  </div>

  <div class="child-table workspace note" x-child="note"></div>

  <div class="buttonbar">
    <div class="button default text report" x-report="lifecycle"></div>
    <div class="button default text notes"></div>
    <div class="button default text refresh"></div>
    <div class="button default text control add"></div>
    <div class="button default text control edit"></div>
    <div class="button default text action delete"></div>
  </div>

  <div class="child-table workspace active event" x-child="event"></div>
</div>
