<div class="table stage" x-fetch="stages" x-target=".rows" breadcrumb="stage">
  <div class="columns">
    <div class="column name">Name</div>
  </div>

  <div class="rows">
    <div class="row hover x-template">
      <label class="field">
        <input class="name" name="name" tabindex="0">
      </label>
    </div>
  </div>

  <div class="buttonbar">
    <div class="button default cancel icon">&nbsp;</div>
    <div class="button default ok icon">&nbsp;</div>
    <div class="button default refresh icon">&nbsp;</div>
    <div class="button default add icon">&nbsp;</div>
    <div class="button default update icon">&nbsp;</div>
    <div class="button default delete icon">&nbsp;</div>
  </div>
</div>
