<div class="table photo gallery" x-target=">.rows">
  <div class="rows" ts-edit="photos">
    <div class="row x-template">
      <div class="buttonbar rowbar">
        <div title="back" class="button icon back"></div>
        <div title="edit" class="button default icon control edit"></div>
        <div title="delete" class="button icon action delete"></div>
        <div title="notes" class="button default icon notes"></div>
      </div>

      <div class="field imgtile">
        <img class="image" name="image" x-image-path="album">
      </div>

      <!-- <div class="detail owner"> -->
      <!-- <div class="parent" name="parenttype"></div> -->
      <!-- <div class="parent" name="link"></div> -->
      <!-- </div> -->

      <label class="field imaging">
        <input class="photo" type="file" accept="image/*" tabindex="0"></textarea>
      </label>
      <div class="button icon camera imaging">camera</div>

      <div class="field">
        <div class="mtime" name="mtime" x-formatter="short-date"></div>
      </div>

      <div class="field">
        <div class="ctime" name="ctime" x-formatter="short-date"></div>
      </div>
    </div>
  </div>

  <div class="child-table workspace note" x-child="note"></div>

  <div class="buttonbar">
    <div class="button icon add">new photo</div>
  </div>
</div>
