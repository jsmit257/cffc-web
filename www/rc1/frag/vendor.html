<div class="table vendor" x-fetch="vendors" x-target=".rows" breadcrumb="vendor">
  <div class="columns">
    <div class="column name" sort-key="name">Name</div>
    <div class="column website" sort-key="website">Website</div>
  </div>

  <div class="rows">
    <div class="row hover x-template">
      <label class="field">
        <input class="name" name="name" tabindex="0">
      </label>

      <label class="field">
        <input class="website clickable" name="website" tabindex="0">
      </label>
    </div>
  </div>

  <div class="buttonbar">
    <div class="button default cancel text">&nbsp;</div>
    <div class="button default ok text">&nbsp;</div>
    <div class="button default refresh text">&nbsp;</div>
    <div class="button default add text">&nbsp;</div>
    <div class="button default update text">&nbsp;</div>
    <div class="button default delete text">&nbsp;</div>
  </div>
</div>
