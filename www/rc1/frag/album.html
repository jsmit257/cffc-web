<div class="table album" x-fetch="photoalbum" x-target=">.rows" no-breadcrumb>
  <div class="rows">
    <div class="row hover x-template imgtile">
      <div class="buttonbar rowbar">
        <div class="button icon control edit"></div>
      </div>
      <!--
        it's not really a thumbnail, but it should be; until that's figured out,
        each one is the full-size image download scaled in the UI
        -->
      <img class="thumbnail image">

      <div class="detail mtime short-date" name="mtime" x-formatter="short-date"></div>

      <div class="detail ctime short-date" name="ctime" x-formatter="short-date"></div>

      <div class="detail owner">
        <div class="parent" name="parenttype"></div>
        <div class="parent" name="link"></div>
      </div>
      <!-- 
        think about adding space for notes, then it becomes like the regular 
        photos interface
        -->
    </div>
  </div>
</div>
