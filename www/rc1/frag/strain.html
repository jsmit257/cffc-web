<div class="table strain soft-delete" x-fetch="strains" x-target=">.rows" breadcrumb="strain">
  <div class="columns">
    <div class="column name" sort-key="name">Name</div>
    <div class="column species" sort-key="species">Species</div>
    <div class="column vendor" sort-key="vendor">Vendor</div>
    <div class="column ctime" sort-key="ctime">Created At</div>
    <div class="column saheader">Strain Attributes</div>
  </div>

  <div class="rows">
    <div class="row hover x-template">
      <label class="field name">
        <input class="name" name="name" tabindex="0">
      </label>

      <label class="field species">
        <input class="species" name="species" tabindex="0">
      </label>

      <label class="field vendor">
        <select class="vendor" name="vendor" x-fetch="vendors" render-attr="name" tabindex="0"></select>
      </label>

      <label class="field ctime">
        <div class="ctime short-date" x-formatter="short-date" name="ctime"></div>
      </label>
    </div>
  </div>

  <!-- breadcrumb is going to get noisy after a while -->
  <div class="table strainattributes" x-target=">.rows" breadcrumb="strainattribute">
    <datalist id="strain-attr-names" x-fetch="strainattributenames"></datalist>

    <div class="columns">
      <div class="column name" sort-key="name">Attribute Name</div>
      <div class="column value">Value</div>
    </div>

    <div class="rows">
      <div class="row hover x-template">
        <label class="field">
          <input class="name" name="name" list="strain-attr-names" tabindex="0">
        </label>

        <label class="field">
          <input class="value" name="value" tabindex="0">
        </label>
      </div>
    </div>

    <div class="buttonbar">
      <div class="button delete"></div>
      <div class="button default add"></div>
      <div class="button default update"></div>
      <div class="button ok"></div>
    </div>
  </div>

  <div class="buttonbar">
    <div class="button default cancel icon">&nbsp;</div>
    <div class="button default ok icon">&nbsp;</div>
    <div class="button default refresh icon">&nbsp;</div>
    <div class="button default add icon">&nbsp;</div>
    <div class="button default update icon">&nbsp;</div>
    <div class="button default delete icon">&nbsp;</div>
  </div>
</div>
