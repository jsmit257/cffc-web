<div class="table ingredient" x-fetch="ingredients" x-target=".rows" breadcrumb="ingredient">
  <div class="columns">
    <div class="column name" sort-key="name">Name</div>
  </div>

  <div class="rows">
    <div class="row hover x-template">
      <label class="field name">
        <input class="name" name="name" readonly tabindex="0">
      </label>
    </div>
  </div>

  <div class="buttonbar">
    <div class="button expand">&check;</div>
    <div class="button collapse">&times;</div>
  </div>
</div>
